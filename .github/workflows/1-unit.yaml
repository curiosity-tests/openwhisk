name: Unit Tests

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [master, 2.0.0]
  pull_request:
    branches: [master, 2.0.0]
    types: [opened, synchronize, reopened]
  schedule:
  - cron: '30 1 * * 1,3,5'

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  # openwhisk env
  TEST_SUITE: Unit
  ANSIBLE_CMD: "ansible-playbook -i environments/local -e docker_image_prefix=testing"
  GRADLE_PROJS_SKIP: ""

  ## secrets
  # (optional) slack incoming wehbook for notifications
  SLACK_WEBHOOK: ${{secrets.SLACK_WEBHOOK}}

  # (optional) s3 log upload
  LOG_BUCKET: ${{ secrets.LOG_BUCKET }}
  LOG_ACCESS_KEY_ID: ${{ secrets.LOG_ACCESS_KEY_ID }}
  LOG_SECRET_ACCESS_KEY: ${{ secrets.LOG_SECRET_ACCESS_KEY }}
  LOG_REGION: ${{ secrets.LOG_REGION }}

  # some tests need also this even if they are empty on pull_requests...
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

  # github
  GH_BUILD: ${{ 'push' }}-${{ github.sha }}
  GH_BRANCH: ${{ github.head_ref || github.ref_name }}

  # https://develocity.apache.org
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

permissions:
  contents: read
  id-token: write

run-name: "Unit Tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  openwhisk:
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: "Setup"
      run: ./tools/github/setup.sh
    - name: Maximize free space
      run: >
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
    - name: Check free space
      run: df -h
    - id: tests
      name: Run Tests
      run: "./tools/github/run${{ env.TEST_SUITE }}Tests.sh"
      continue-on-error: true
    - id: logs
      name: Show results and Upload logs
      run: ./tools/github/checkAndUploadLogs.sh ${{ env.TEST_SUITE }}
    - name: Slack Notification
      run: >
        ./tools/github/writeOnSlack.sh
        "[$TEST_SUITE]" ${{ steps.tests.outcome }} on ${GH_BUILD}
        $'\nbranch:' $GH_BRANCH
        $'\nmessage:' "$(git log -1 --oneline | cat)"
        $'\nlogs:' ${{ steps.logs.outputs.logs }}
        $'\nreport:' ${{ steps.logs.outputs.report }}
    - name: Results
      run: test "${{ steps.tests.outcome }}" ==  "success"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
